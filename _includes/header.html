<header class="site-header" data-header>
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="SNRC home">
      <img src="{{ '/assets/images/brand/snrc-classic-logo.png' | relative_url }}" alt="SNRC">
      <span class="brand-context">Cornell University</span>
    </a>

    <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-navigation" data-menu-button>
      <span class="menu-label">Menu</span>
      <span class="menu-lines" aria-hidden="true"><span></span><span></span></span>
    </button>

    <nav class="site-nav" id="site-navigation" aria-label="Main navigation" data-menu>
      {% for item in site.data.navigation %}
        {% assign item_url = item.url | relative_url %}
        <a href="{{ item_url }}" {% if page.url == item.url %}class="active" aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
      <a class="button button-small nav-join" href="{{ site.data.site.links.join }}" target="_blank" rel="noopener">Join SNRC <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
