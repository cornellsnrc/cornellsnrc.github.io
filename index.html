<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap');

    :root {
      --forest: #173d2b;
      --forest-dark: #102c1f;
      --text: #4d5851;
      --muted: #727c75;
      --nav-background: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: transparent;
    }

    body {
      font-family: "DM Sans", Arial, sans-serif;
      color: var(--text);
    }

    /* PAGE */
    .page-shell {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    /* HERO */
    .hero {
      position: relative;
      width: 100%;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image:
        linear-gradient(rgba(10,31,21,0.02), rgba(10,31,21,0.12)),
        url('https://raw.githubusercontent.com/cornellsnrc/snrc-image-src/main/SNRC-Website-Banner.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(13,35,24,0.05), rgba(13,35,24,0.20));
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: min(1100px, 90%);
      padding: 45px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

    .hero-title-wrapper,
    .hero-subtitle-wrapper {
      width: 100%;
    }

    .hero-title {
      margin: 0;
      width: 100%;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(18px, 5vw, 28px);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.025em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.28);
    }

    .hero-subtitle {
      width: 100%;
      margin-top: 0px;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(14px, 1.7vw, 16px);
      font-weight: 400;
      letter-spacing: 0.12em;
      opacity: 0.9;
      text-shadow: 0 2px 9px rgba(0,0,0,0.25);
    }

    /* NAVIGATION */
    .navigation-wrapper {
      width: 100%;
      background: var(--nav-background);
      border-bottom: 1px solid rgba(23,61,43,0.10);
      box-shadow: 0 2px 12px rgba(0,0,0,0.025);
    }

    .navbar {
      width: 100%;
      height: 58px;
      padding: 0 clamp(20px, 4vw, 62px);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .nav-item {
      display: flex;
      align-items: center;
    }

    .nav-left {
      justify-content: flex-start;
    }

    .nav-center {
      justify-content: center;
    }

    .nav-right {
      justify-content: flex-end;
    }

    /* BRAND */
    .brand-wrapper {
      display: flex;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo {
      width: 145px;
      height: 30px;
      object-fit: contain;
      display: block;
    }

    /* LINKS */
    .links {
      display: flex;
      align-items: center;
      gap: clamp(22px, 2.8vw, 42px);
    }

    .nav-link-wrapper {
      display: flex;
      align-items: center;
    }

    .nav-link {
      position: relative;
      padding: 6px 0;
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: color 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--forest);
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 1px;
      width: 100%;
      height: 1.5px;
      background: var(--forest);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.2s ease;
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      transform: scaleX(1);
    }

    .nav-link.active {
      font-weight: 700;
    }

    /* JOIN */
    .join-wrapper {
      display: flex;
      align-items: center;
    }

    .join {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      background: var(--forest);
      color: white;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .join:hover {
      background: var(--forest-dark);
      transform: translateY(-1px);
    }

    .join-text {
      display: inline-block;
    }

    .join-arrow {
      display: inline-block;
      font-size: 13px;
      line-height: 1;
    }

    /* RESPONSIVE */
    @media (max-width: 850px) {
      .navbar {
        padding: 0 20px;
      }

      .logo {
        width: 115px;
      }

      .links {
        gap: 20px;
      }
    }

    @media (max-width: 650px) {
      .hero {
        height: 150px;
        background-position: center;
      }

      .hero-content {
        width: 94%;
        padding: 45px 16px;
      }

      .hero-title {
        font-size: clamp(18px, 10vw, 24px);
      }

      .hero-subtitle {
        margin-top: 10px;
        font-size: 14px;
        letter-spacing: 0.09em;
      }

      .navbar {
        height: 54px;
        padding: 0 14px;
      }

      .logo {
        width: 75px;
        height: 38px;
      }

      .links {
        gap: 13px;
      }

      .nav-link {
        font-size: 10px;
      }

      .join {
        padding: 8px 10px;
        font-size: 0;
      }

      .join-arrow {
        font-size: 14px;
      }
    }

    @media (max-width: 450px) {
      .navbar {
        grid-template-columns: auto 1fr auto;
      }

      .logo {
        width: 58px;
      }

      .links {
        gap: 9px;
      }

      .nav-link {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">

    <div class="hero">
      <div class="hero-overlay"></div>

      <div class="hero-content">
        <div class="hero-title-wrapper">
          <h1 class="hero-title">Society for Natural Resources Conservation</h1>
        </div>

        <div class="hero-subtitle-wrapper">
          <div class="hero-subtitle">Cornell University</div>
        </div>
      </div>
    </div>

    <div class="navigation-wrapper">
      <div class="navbar">

        <div class="nav-item nav-left">
          <div class="brand-wrapper">
            <a
              class="brand"
              href="https://sites.google.com/view/cu-snrc/home"
              target="_top"
              aria-label="SNRC Home"
            >
              <img
                class="logo"
                src="https://raw.githubusercontent.com/cornellsnrc/snrc-image-src/main/snrc-classic-logo.png"
                alt="SNRC Logo"
              >
            </a>
          </div>
        </div>

        <div class="nav-item nav-center">
          <div class="links">

            <div class="nav-link-wrapper">
              <a class="nav-link" data-page="home"
                href="https://sites.google.com/view/cu-snrc/home"
                target="_top">Home</a>
            </div>

            <div class="nav-link-wrapper">
              <a class="nav-link" data-page="about"
                href="https://sites.google.com/view/cu-snrc/about"
                target="_top">About</a>
            </div>

            <div class="nav-link-wrapper">
              <a class="nav-link" data-page="events"
                href="https://sites.google.com/view/cu-snrc/events"
                target="_top">Events</a>
            </div>

            <div class="nav-link-wrapper">
              <a class="nav-link" data-page="contact"
                href="https://sites.google.com/view/cu-snrc/contact"
                target="_top">Contact</a>
            </div>

          </div>
        </div>

        <div class="nav-item nav-right">
          <div class="join-wrapper">
            <a class="join" href="YOUR_CAMPUSGROUPS_LINK" target="_blank">
              <div class="join-text">Join SNRC</div>
              <div class="join-arrow">↗</div>
            </a>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    const source = (document.referrer || "").toLowerCase();
    let currentPage = "home";

    ["about", "events", "contact"].forEach(page => {
      if (source.includes(`/${page}`)) currentPage = page;
    });

    document.querySelectorAll(".nav-link").forEach(link => {
      const active = link.dataset.page === currentPage;
      link.classList.toggle("active", active);
      if (active) link.setAttribute("aria-current", "page");
    });
  </script>
</body>
</html>
