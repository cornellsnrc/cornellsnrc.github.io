# EDIT THIS FILE for organization-wide text, links, and contact information.
organization:
  name: Society for Natural Resources Conservation
  short_name: SNRC
  university: Cornell University
  email: cornellsnrc@gmail.com
  tagline: Conservation builds brighter tomorrows.
  description: >-
    SNRC is a student-run organization that creates real environmental impact on
    campus and in the surrounding community through education, advocacy, and
    direct hands-on engagement.
  mission: >-
    SNRC is a student-run organization committed to creating real environmental
    impact on campus and in the surrounding community by identifying pressing
    challenges in natural resource conservation, cultivating informed dialogue
    and practical solutions, and inspiring collective action. SNRC confronts the
    environmental consequences of human consumption by turning awareness into
    responsibility and responsibility into action. Through education, advocacy,
    and direct hands-on engagement, SNRC empowers students across disciplines to
    protect natural resources, restore shared spaces, and strengthen a culture of
    sustainability. By connecting environmental knowledge with meaningful action,
    SNRC works to create visible, lasting change locally, collectively, and with
    purpose.
  goals: >-
    Each year, SNRC identifies focus areas for student-driven projects, outreach,
    and fieldwork. This keeps our work focused while allowing us to respond to
    emerging environmental needs and create visible, lasting change.
