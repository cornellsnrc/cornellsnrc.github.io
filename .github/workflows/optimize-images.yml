name: Optimize website images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: image-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Optimize uploaded photos
        run: python scripts/optimize_images.py

      - name: Save optimized photos
        run: |
          if git diff --quiet -- assets/images .image-optimization.json; then
            echo "No image changes to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images .image-optimization.json
          git commit -m "Optimize uploaded website images"
          git push
